<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Gallery | Rachmat & Dini</title>
    
    <script>
        if (sessionStorage.getItem('loveJourneyAuth') !== 'true') {
            window.location.href = 'index.html'; // Tendang balik ke pintu depan kalau belum login
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #d81b60;
            --primary-dark: #ad1457;
            --accent: #FFD700;
            --bg-pink: #fce4ec;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 10px 30px rgba(216, 27, 96, 0.15);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: 'Jost', sans-serif;
            background: linear-gradient(135deg, #fff0f6 0%, #ffcdd2 100%);
            min-height: 100vh; color: #444; padding-bottom: 50px;
        }

        /* HEADER */
        .app-header {
            height: 80px;
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.03);
        }

        .home-btn {
            text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
            padding: 8px 15px; border-radius: 50px; background: rgba(216,27,96,0.05);
        }
        .home-btn:hover { background: var(--primary); color: white; transform: translateX(-3px); }

        .brand-center { text-align: center; }
        .brand-center h1 { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--primary); line-height: 1; margin: 0; }
        .brand-center span { font-family: 'Playfair Display', serif; font-size: 0.65rem; color: #888; letter-spacing: 2px; text-transform: uppercase; }

        .auth-status { 
            color: var(--primary); font-size: 0.85rem; font-weight: 600; 
            display: flex; align-items: center; gap: 5px; background: rgba(216,27,96,0.1); 
            padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .auth-status:hover { background: var(--primary); color: white; }

        /* GALLERY GRID */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px; padding: 30px 20px; max-width: 1400px; margin: 0 auto;
        }

        .gallery-item {
            position: relative; border-radius: 15px; overflow: hidden;
            box-shadow: var(--shadow); cursor: pointer; background: white;
            border: 1px solid white; aspect-ratio: 1 / 1; 
            opacity: 0; animation: fadeUp 0.8s forwards;
        }

        .g-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .gallery-item:hover .g-img { transform: scale(1.1); }
        
        .g-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(216, 27, 96, 0.9), transparent);
            opacity: 0; transition: 0.3s;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
        }
        .gallery-item:hover .g-overlay { opacity: 1; }
        
        .g-caption { color: white; font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; line-height: 1.3; margin-bottom: 5px; }
        .g-date { color: var(--accent); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }

        /* EDIT BTN (Sekarang Langsung Muncul) */
        .btn-edit-admin {
            position: absolute; top: 10px; right: 10px;
            width: 32px; height: 32px; border-radius: 50%;
            background: white; color: var(--primary); border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .btn-edit-admin:hover { background: var(--primary); color: white; transform: scale(1.1); }

        /* MODALS & LIGHTBOX */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 20px; border-top: 5px solid var(--primary); animation: popup 0.4s; }
        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-save:hover { background: var(--primary-dark); }
        
        .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 4000; display: none; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; padding: 20px; }
        .lightbox.active { display: flex; opacity: 1; }
        .lb-img { max-width: 90%; max-height: 80vh; border-radius: 10px; border: 2px solid white; }
        .lb-close { position: absolute; top: 30px; right: 30px; color: white; font-size: 2.5rem; cursor: pointer; transition: 0.3s; }
        .lb-close:hover { transform: scale(1.2); }

        /* MUSIC WIDGET */
        .music-widget { position: fixed; bottom: 30px; left: 30px; z-index: 1000; display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 50px; box-shadow: var(--shadow); border: 1px solid white; cursor: pointer; }
        .music-icon { width: 35px; height: 35px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; animation: pulse 2s infinite; }
        .equalizer { display: flex; gap: 3px; height: 15px; align-items: flex-end; }
        .bar { width: 3px; background: var(--primary); }
        .bar.playing { animation: equalize 1s infinite alternate; }

        @keyframes equalize { 0% {height: 4px;} 100% {height: 15px;} }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.4);} 70% {box-shadow: 0 0 0 10px transparent;} 100% {box-shadow: 0 0 0 0 transparent;} }
        @keyframes fadeUp { from{opacity:0; transform:translateY(20px)} to{opacity:1; transform:translateY(0)} }
        @keyframes popup { from{transform:scale(0.8); opacity:0} to{transform:scale(1); opacity:1} }

        @media(max-width: 768px) {
            .app-header { height: 60px; padding: 0 15px; }
            .brand-center h1 { font-size: 1.6rem; }
            .music-text { display: none; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
        </div>
        <div class="header-center brand-center">
            <h1>Our Gallery</h1>
            <span>Koleksi Kenangan Abadi</span>
        </div>
        <div class="header-right">
            <div class="auth-status" onclick="kunciPintu()" title="Kunci Kembali Ruangan Ini">
                <i class="fa-solid fa-lock-open"></i> <span class="music-text">Ruang Terbuka</span>
            </div>
        </div>
    </header>

    <div class="gallery-container" id="galleryGrid"></div>

    <div class="modal" id="modalEdit">
        <div class="modal-box">
            <h3 style="margin-bottom:20px; color:var(--primary); text-align:center;">Update Cerita</h3>
            <input type="hidden" id="editId">
            <div style="margin-bottom:15px;">
                <label style="font-size:0.8rem; color:#666; font-weight: 600; display: block; margin-bottom: 5px;">Kenangan</label>
                <input type="text" id="inpCap" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-family: 'Jost';" placeholder="Tulis caption...">
            </div>
            <div style="margin-bottom:15px;">
                <label style="font-size:0.8rem; color:#666; font-weight: 600; display: block; margin-bottom: 5px;">Tanggal</label>
                <input type="text" id="inpDate" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-family: 'Jost';" placeholder="Contoh: 17 Juni 2025">
            </div>
            <button class="btn-save" onclick="saveCaption()">Simpan</button>
            <p style="text-align:center; margin-top:15px; cursor:pointer; color:#999; font-weight: 600;" onclick="closeAllModals()">Batal</p>
        </div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lb-close">&times;</div>
        <img src="" class="lb-img" id="lbImg">
    </div>

    <div class="music-widget" onclick="toggleMusic()">
        <div class="music-icon"><i class="fa-solid fa-music"></i></div>
        <div class="equalizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="music-text" style="font-size: 0.8rem; color: var(--primary);">
            <b>Bersamamu - Jaz</b>
        </div>
    </div>
    <audio id="bgMusic" loop src="assets/music/galeri.mp3"></audio>

    <script>
        // --- 1. CONFIG ---
        const totalFoto = 9;
        const folderPath = "assets/images/";
        const filePrefix = "galeri";
        
        const firebaseConfig = {
            apiKey: "AIzaSyC64-tVQSGInI95H4Y763PFsc7A0zz_Df4",
            authDomain: "weblove-95a42.firebaseapp.com",
            projectId: "weblove-95a42",
            storageBucket: "weblove-95a42.firebasestorage.app",
            messagingSenderId: "270037244406",
            appId: "1:270037244406:web:c284cd60efc8cdd8874fd7"
        };

        try { firebase.initializeApp(firebaseConfig); } catch(e){}
        const db = firebase.firestore();

        // --- 2. KUNCI PINTU (LOGOUT SSO) ---
        window.kunciPintu = () => {
            if(confirm("Tutup dan kunci kembali ruang kenangan ini?")) {
                sessionStorage.removeItem('loveJourneyAuth');
                window.location.href = 'index.html';
            }
        }

        // --- 3. GENERATE GALLERY ---
        const grid = document.getElementById('galleryGrid');
        for (let i = 1; i <= totalFoto; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            const basePath = `${folderPath}${filePrefix}${i}`;
            
            item.innerHTML = `
                <button class="btn-edit-admin" onclick="openEditModal(${i})" title="Edit Caption"><i class="fa-solid fa-pen"></i></button>
                <img src="${basePath}.jpg" class="g-img" loading="lazy" 
                     onerror="this.onerror=null; this.src='${basePath}.jpeg'; this.onerror=function(){this.src='${basePath}.png';}">
                <div class="g-overlay" onclick="openLightbox(this.previousElementSibling.src)">
                    <div class="g-caption" id="cap-${i}">...</div>
                    <div class="g-date" id="date-${i}">Memory #${i}</div>
                </div>
            `;
            grid.appendChild(item);
        }

        // --- 4. FIREBASE SYNC ---
        db.collection('gallery_text').onSnapshot(snap => {
            snap.forEach(doc => {
                const d = doc.data();
                if(document.getElementById(`cap-${doc.id}`)) document.getElementById(`cap-${doc.id}`).innerText = d.caption;
                if(document.getElementById(`date-${doc.id}`)) document.getElementById(`date-${doc.id}`).innerText = d.date;
            });
        });

        // --- 5. EDIT LOGIC (Langsung Akses) ---
        window.openEditModal = (id) => {
            document.getElementById('modalEdit').classList.add('active');
            document.getElementById('editId').value = id;
            document.getElementById('inpCap').value = document.getElementById(`cap-${id}`).innerText !== '...' ? document.getElementById(`cap-${id}`).innerText : '';
            document.getElementById('inpDate').value = document.getElementById(`date-${id}`).innerText.includes('Memory #') ? '' : document.getElementById(`date-${id}`).innerText;
        }

        window.saveCaption = () => {
            const id = document.getElementById('editId').value;
            db.collection('gallery_text').doc(String(id)).set({
                caption: document.getElementById('inpCap').value,
                date: document.getElementById('inpDate').value
            }, {merge:true}).then(() => {
                alert("Kenangan diperbarui! ✨");
                closeAllModals();
            }).catch(e => alert("Gagal menyimpan: " + e.message));
        }

        window.closeAllModals = () => { document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); }

        // --- 6. MUSIC & LIGHTBOX ---
        const music = document.getElementById('bgMusic');
        let isPlaying = false;

        window.toggleMusic = () => {
            if(isPlaying) {
                music.pause();
                document.querySelectorAll('.bar').forEach(b => b.classList.remove('playing'));
            } else {
                music.play().catch(() => {});
                document.querySelectorAll('.bar').forEach(b => b.classList.add('playing'));
            }
            isPlaying = !isPlaying;
        }

        window.openLightbox = (src) => {
            const lb = document.getElementById('lightbox');
            document.getElementById('lbImg').src = src;
            lb.classList.add('active');
        }
        window.closeLightbox = () => { document.getElementById('lightbox').classList.remove('active'); }

        // Auto-play music saat interaksi pertama
        document.addEventListener('click', () => {
            if(!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    document.querySelectorAll('.bar').forEach(b => b.classList.add('playing'));
                }).catch(() => {});
            }
        }, {once: true});

    </script>
</body>
</html>
