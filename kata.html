<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Hati | Rachmat & Dini</title>
    
    <script>
        if (sessionStorage.getItem('loveJourneyAuth') !== 'true') {
            window.location.href = 'index.html'; // Tendang balik ke pintu depan kalau belum login
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* =========================================
           1. THEME VARIABLES
           ========================================= */
        :root {
            --primary: #d81b60;
            --primary-dark: #ad1457;
            --accent: #FFD700;
            --bg-pink: #fce4ec;
            --paper: #fff;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--bg-pink);
            background-image: radial-gradient(circle at 50% 50%, #f8bbd0, #fce4ec, #ffffff);
            min-height: 100vh;
            color: #444;
            padding-bottom: 80px; 
        }

        /* HEADER (Disamakan Style-nya dengan Peta, Galeri, Wishlist) */
        .app-header {
            height: 80px;
            background: var(--glass); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 30px; z-index: 2000; box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .home-btn {
            text-decoration: none; color: var(--primary); font-weight: 600; font-size: 0.9rem;
            display: flex; align-items: center; gap: 8px; transition: 0.3s;
            padding: 8px 15px; border-radius: 50px; background: rgba(216,27,96,0.05);
        }
        .home-btn:hover { background: var(--primary); color: white; transform: translateX(-3px); }

        .brand-center { text-align: center; }
        .brand-center h1 { font-family: 'Great Vibes', cursive; font-size: 2.5rem; color: var(--primary); line-height: 1; margin: 0; }
        .brand-center span { font-family: 'Playfair Display', serif; font-size: 0.65rem; color: #888; letter-spacing: 2px; text-transform: uppercase; }

        .header-right { display: flex; align-items: center; gap: 15px; }

        .auth-status { 
            color: var(--primary); font-size: 0.85rem; font-weight: 600; 
            display: flex; align-items: center; gap: 5px; background: rgba(216,27,96,0.1); 
            padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: 0.3s;
        }
        .auth-status:hover { background: var(--primary); color: white; }

        /* GRID NOTES (MASONRY LOOK) */
        .notes-container {
            column-count: 3; column-gap: 25px;
            padding: 20px; max-width: 1200px; margin: 0 auto;
        }
        
        .note-card {
            break-inside: avoid; margin-bottom: 25px;
            background: var(--paper); border-radius: 20px;
            padding: 30px; position: relative;
            box-shadow: var(--shadow); transition: 0.4s;
            overflow: hidden; opacity: 0; animation: fadeUp 0.8s forwards;
            border-top: 5px solid var(--primary);
        }

        .note-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(216, 27, 96, 0.15); }
        
        /* Hiasan Kutipan Besar di Belakang */
        .note-card::before {
            content: "“"; position: absolute; top: 10px; left: 20px;
            font-family: 'Playfair Display', serif; font-size: 6rem;
            color: var(--bg-pink); opacity: 0.5; z-index: 0; pointer-events: none;
        }

        .note-text {
            font-family: 'Playfair Display', serif; font-size: 1.1rem;
            line-height: 1.8; color: #555; position: relative; z-index: 1;
            white-space: pre-line;
        }

        .note-footer {
            margin-top: 20px; padding-top: 15px; border-top: 1px dashed #eee;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; color: #999; position: relative; z-index: 1;
        }

        /* Tombol Hapus otomatis muncul */
        .btn-delete {
            background: none; border: none; color: #ff6b6b;
            cursor: pointer; font-size: 0.9rem; transition: 0.3s;
            display: inline-block;
        }
        .btn-delete:hover { color: red; transform: scale(1.2); }

        /* FAB ADD BUTTON (Otomatis muncul) */
        .fab-add {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px; background: var(--primary);
            color: white; border-radius: 50%; border: none;
            font-size: 1.5rem; cursor: pointer; z-index: 100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
        }
        .fab-add:hover { transform: scale(1.1) rotate(90deg); }

        /* MODALS */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            z-index: 3000; display: none; align-items: center; justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: white; width: 90%; max-width: 500px; padding: 30px;
            border-radius: 20px; border-top: 5px solid var(--primary);
            animation: popup 0.4s;
        }
        .form-group { margin-bottom: 20px; }
        .form-input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Jost'; }
        
        .form-textarea {
            width: 100%; height: 150px; padding: 15px;
            border: 1px solid #ddd; border-radius: 8px;
            font-family: 'Playfair Display', serif; font-size: 1.1rem;
            resize: none; background: #fffdf9;
        }
        .form-textarea:focus { outline: 1px solid var(--primary); background: white; }

        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; }

        /* MUSIC WIDGET */
        .music-widget { position: fixed; bottom: 30px; left: 30px; z-index: 1000; display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 10px 20px; border-radius: 50px; box-shadow: 0 10px 25px rgba(216, 27, 96, 0.2); border: 1px solid white; cursor: pointer; transition: 0.3s; }
        .music-widget:hover { transform: scale(1.05); }
        .music-icon { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; animation: pulse 2s infinite; }
        .equalizer { display: flex; gap: 3px; height: 20px; align-items: flex-end; }
        .bar { width: 3px; background: var(--primary); animation: equalize 1s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; } .bar:nth-child(3) { animation-delay: 0.4s; }

        /* ANIMATIONS & RESPONSIVE */
        @keyframes popup { from{transform:scale(0.8); opacity:0} to{transform:scale(1); opacity:1} }
        @keyframes fadeUp { from{transform:translateY(20px); opacity:0} to{transform:translateY(0); opacity:1} }
        @keyframes pulse { 0% {box-shadow: 0 0 0 0 rgba(216, 27, 96, 0.7);} 70% {box-shadow: 0 0 0 10px transparent;} 100% {box-shadow: 0 0 0 0 transparent;} }
        @keyframes equalize { 0% {height: 5px;} 100% {height: 20px;} }

        @media(max-width: 900px) { .notes-container { column-count: 2; } }
        @media(max-width: 768px) { 
            .app-header { height: 60px; padding: 0 15px; margin-bottom: 20px; }
            .brand-center h1 { font-size: 1.8rem; }
            .brand-center span { font-size: 0.5rem; }
            .auth-text, .music-text { display: none; }
        }
        @media(max-width: 600px) { .notes-container { column-count: 1; } }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="home-btn"><i class="fa-solid fa-arrow-left"></i> <span class="auth-text">Kembali</span></a>
        </div>
        <div class="header-center brand-center">
            <h1>Love Notes</h1>
            <span>Bisikan Dari Hati</span>
        </div>
        <div class="header-right">
            <div class="auth-status" onclick="kunciPintu()" title="Kunci Kembali Ruangan Ini">
                <i class="fa-solid fa-lock-open"></i> <span class="auth-text">Ruang Terbuka</span>
            </div>
        </div>
    </header>

    <div class="notes-container" id="notesGrid">
        <div style="text-align:center; width:100%; color:#888; grid-column:span 3;">
            <i class="fa-solid fa-spinner fa-spin"></i> Membaca Surat...
        </div>
    </div>

    <button class="fab-add" id="btnAdd" onclick="openModalAdd()" title="Tulis Surat Baru"><i class="fa-solid fa-pen-nib"></i></button>

    <div class="music-widget" onclick="toggleMusic()">
        <div class="music-icon"><i class="fa-solid fa-music"></i></div>
        <div class="equalizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        <div class="music-text" style="font-size: 0.85rem; color: var(--primary);"><b>Nadhif B. - Penjaga Hati</b><br><span style="font-size:0.75rem; color:#666;">Klik putar</span></div>
    </div>
    <audio id="bgMusic" loop autoplay><source src="assets/music/kata.mp3" type="audio/mp3"></audio>

    <div class="modal" id="modalAdd">
        <div class="modal-box">
            <h3 style="margin-bottom:20px; color:var(--primary); text-align:center;">Tulis Kata Hati</h3>
            
            <div class="form-group">
                <label style="font-size:0.9rem; color:#666; display:block; margin-bottom:5px; font-weight:600;">Isi Surat / Puisi:</label>
                <textarea id="inpText" class="form-textarea" placeholder="Tuliskan sesuatu yang manis di sini..."></textarea>
            </div>
            
            <div class="form-group">
                <label style="font-size:0.9rem; color:#666; font-weight:600; display:block; margin-bottom:5px;">Tanggal:</label>
                <input type="date" id="inpDate" class="form-input">
            </div>

            <button class="btn-save" onclick="saveNote()">Simpan Tulisan</button>
            <div style="text-align:center; margin-top:15px; cursor:pointer; color:#888; font-weight:600;" onclick="closeAllModals()">Batal</div>
        </div>
    </div>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyC64-tVQSGInI95H4Y763PFsc7A0zz_Df4",
            authDomain: "weblove-95a42.firebaseapp.com",
            projectId: "weblove-95a42",
            storageBucket: "weblove-95a42.firebasestorage.app",
            messagingSenderId: "270037244406",
            appId: "1:270037244406:web:c284cd60efc8cdd8874fd7"
        };

        try { firebase.initializeApp(firebaseConfig); } catch(e){}
        const db = firebase.firestore();

        // --- 2. FUNGSI KUNCI PINTU (SSO LOGOUT) ---
        window.kunciPintu = () => {
            if(confirm("Tutup dan kunci kembali ruang pesan ini?")) {
                sessionStorage.removeItem('loveJourneyAuth');
                window.location.href = 'index.html';
            }
        }

        // --- 3. LOAD NOTES ---
        const grid = document.getElementById('notesGrid');
        
        db.collection('notes').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
            grid.innerHTML = '';
            
            if(snapshot.empty){
                grid.innerHTML = '<p style="text-align:center; width:100%; color:#888; grid-column:span 3;">Belum ada surat cinta yang ditulis.</p>';
                return;
            }

            let index = 0;
            snapshot.forEach(doc => {
                const d = doc.data();
                const id = doc.id;
                index++;

                const note = document.createElement('div');
                note.className = 'note-card';
                note.style.animationDelay = `${index * 0.1}s`;
                
                const dateDisplay = d.date ? d.date : 'Tanpa Tanggal';

                note.innerHTML = `
                    <div class="note-text">${d.content}</div>
                    <div class="note-footer">
                        <span><i class="fa-regular fa-clock"></i> ${dateDisplay}</span>
                        <button class="btn-delete" onclick="deleteNote('${id}')" title="Hapus Surat">
                            <i class="fa-solid fa-trash"></i> Hapus
                        </button>
                    </div>
                `;
                grid.appendChild(note);
            });
        });

        // --- 4. ADD & DELETE NOTE ---
        function openModalAdd() { 
            document.getElementById('modalAdd').classList.add('active'); 
            document.getElementById('inpDate').value = new Date().toISOString().split('T')[0];
        }

        function closeAllModals() { 
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active')); 
        }

        function saveNote() {
            const content = document.getElementById('inpText').value;
            const date = document.getElementById('inpDate').value;

            if(!content.trim()) return alert("Tulis dulu dong isinya!");

            db.collection('notes').add({
                content: content,
                date: date,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Surat berhasil disimpan! 💌");
                closeAllModals();
                document.getElementById('inpText').value = '';
            }).catch(e => alert("Gagal menyimpan: " + e.message));
        }

        function deleteNote(id) {
            if(confirm("Yakin mau menghapus tulisan ini?")) {
                db.collection('notes').doc(id).delete();
            }
        }

        // --- 5. MUSIC LOGIC ---
        const music = document.getElementById('bgMusic');
        let isPlaying = false;
        
        function toggleMusic() { 
            if(isPlaying){ 
                music.pause(); 
                document.querySelectorAll('.bar').forEach(b=>b.style.animation='none'); 
            } else { 
                music.play().catch(()=>{}); 
                document.querySelectorAll('.bar').forEach(b=>b.style.animation='equalize 1s infinite alternate'); 
            }
            isPlaying = !isPlaying; 
        }
        
        // Pancing music otomatis jalan pas diklik sembarang
        document.addEventListener('click', function() {
            if (!isPlaying) {
                music.play().then(() => {
                    document.querySelectorAll('.bar').forEach(b => b.style.animation = 'equalize 1s infinite alternate');
                    isPlaying = true;
                }).catch(e => console.log("Menunggu interaksi user..."));
            }
        }, { once: true });

    </script>
</body>
</html>
